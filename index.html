<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>C++ WebAssembly App</title>
</head>
<body>
  <h1>My C++ WebAssembly Project</h1>
  <p>Check the browser console (F12) or open developer tools to see C++ output!</p>

  <script>
    var Module = {
      onRuntimeInitialized: function() {
        console.log("WebAssembly is ready.");
        // Call the C++ function from JavaScript
        var result = Module._addNumbers(15, 27);
        console.log("Result of 15 + 27 from C++:", result);
      }
    };
  </script>
  <script src="app.js"></script>
</body>
</html>
